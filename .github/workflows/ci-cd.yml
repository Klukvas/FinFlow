          file: ./workspace_service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/workspace_service:latest
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/workspace_service:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/workspace_service:latest
          cache-to: type=inline

  # Stage 14: Admin Panel Build (DISABLED - skip for now)
  stage14-admin-panel:
    name: "Stage 14: Build Admin Panel"
    needs: [detect-changes, e2e-tests]
    if: false  # Disabled - skip admin panel build for now
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
