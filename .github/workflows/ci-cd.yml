  # E2E API Tests: build all services, run integration tests
  e2e-tests:
    name: "E2E API Tests"
    needs: [detect-changes, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate secrets
        run: |
          echo "E2E_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "E2E_INTERNAL_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Generate .env.docker files
        run: |
          # Shared values — must not be placeholder strings (startup validation rejects them)
          SECRET="$E2E_SECRET_KEY"
          ALGO="HS256"
          INTERNAL_TOKEN="$E2E_INTERNAL_TOKEN"

          # user_service
          cat > user_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/user_db
          SECRET_KEY=$SECRET
          ALGORITHM=$ALGO
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          RATE_LIMIT_PER_MINUTE=400
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          EOF

          # category_service (no env_file in compose, but create for safety)

          # expense_service
          cat > expense_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/expense_db
          SECRET_KEY=$SECRET
          ALGORITHM=$ALGO
          CATEGORY_SERVICE_URL=http://category_service:8000
          ACCOUNT_SERVICE_URL=http://account_service:8000
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          MAX_AMOUNT=999999.99
          MAX_DESCRIPTION_LENGTH=500
          HTTP_TIMEOUT=5.0
          HTTP_RETRY_ATTEMPTS=3
          EOF

          # income_service
          cat > income_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/income_db
          SECRET_KEY=$SECRET
          ALGORITHM=$ALGO
          CATEGORY_SERVICE_URL=http://category_service:8000
          ACCOUNT_SERVICE_URL=http://account_service:8000
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          EOF

          # recurring_service
          cat > recurring_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/recurring_db
          SECRET_KEY=$SECRET
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          EOF

          # goals_service
          cat > goals_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/goals_db
          SECRET_KEY=$SECRET
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          EOF

          # pdf_parser_service
          cat > pdf_parser_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/pdf_parser_db
          INTERNAL_SERVICE_TOKEN=$INTERNAL_TOKEN
          SECRET_KEY=$SECRET
          ALGORITHM=$ALGO
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          EOF

          # debt_service
          cat > debt_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/debt_db
          SECRET_KEY=$SECRET
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          EOF

          # account_service
          cat > account_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/account_db
          REDIS_URL=redis://redis:6379
          SECRET_KEY=$SECRET
          ALGORITHM=$ALGO
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          EXPENSE_SERVICE_URL=http://expense_service:8000
          INCOME_SERVICE_URL=http://income_service:8000
          USER_SERVICE_URL=http://user_service:8000
          CURRENCY_SERVICE_URL=http://currency_service:8000
          HTTP_TIMEOUT=5.0
          HTTP_RETRY_ATTEMPTS=3
          MAX_BALANCE=999999999.99
          MAX_NAME_LENGTH=100
          MAX_DESCRIPTION_LENGTH=500
          MAX_CURRENCY_LENGTH=3
          EOF

          # currency_service
          cat > currency_service/.env.docker << EOF
          REDIS_URL=redis://redis:6379
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          EOF

          # subscription_service
          cat > subscription_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/subscription_db
          SECRET_KEY=$SECRET
          ALGORITHM=$ALGO
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          RATE_LIMIT_PER_MINUTE=400
          EOF

          # ai_assistant_service
          cat > ai_assistant_service/.env.docker << EOF
          ANTHROPIC_API_KEY=sk-ant-test-key-not-real
          ANTHROPIC_MODEL=claude-haiku-4-5-20251001
          REDIS_URL=redis://redis:6379
          SECRET_KEY=$SECRET
          ALGORITHM=$ALGO
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          EOF

          # bank_sync_service — generate a valid Fernet key (URL-safe base64 of 32 random bytes)
          BANK_ENCRYPTION_KEY=$(python3 -c "import os, base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          cat > bank_sync_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/bank_sync_db
          SECRET_KEY=$SECRET
          ALGORITHM=$ALGO
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          BANK_TOKEN_ENCRYPTION_KEY=$BANK_ENCRYPTION_KEY
          EOF

          # payment_service
          cat > payment_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/payment_db
          REDIS_URL=redis://redis:6379/0
          LOG_LEVEL=INFO
          JWT_SECRET_KEY=$SECRET
          JWT_ALGORITHM=$ALGO
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          PADDLE_API_KEY=test_paddle_key
          PADDLE_WEBHOOK_SECRET=test_webhook_secret
          PADDLE_ENVIRONMENT=sandbox
          PADDLE_SUCCESS_URL=http://localhost:3000/payment/return
          PADDLE_CANCEL_URL=http://localhost:3000/pricing
          SERVICE_BASE_URL=http://payment_service:8000
          SUBSCRIPTION_SERVICE_URL=http://subscription_service:8080
          IDEMPOTENCY_TTL_SECONDS=86400
          PAYMENTS_ENABLED=false
          EOF

      - name: Build and start services
        env:
          SECRET_KEY: ${{ env.E2E_SECRET_KEY }}
          JWT_SECRET_KEY: ${{ env.E2E_SECRET_KEY }}
          INTERNAL_SECRET_TOKEN: ${{ env.E2E_INTERNAL_TOKEN }}
          ANTHROPIC_API_KEY: "sk-ant-test-key-not-real"
        run: docker compose up --build -d

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install httpx pytest pytest-asyncio faker

      - name: Wait for services to be healthy
        run: |
          SERVICES="8001 8002 8003 8004 8005 8006 8007 8008 8009 8010 8011 8012 8013 8014 8015 8016"
          MAX_WAIT=180
          ELAPSED=0
          INTERVAL=5

          health_url() {
            case "$1" in
              8013|8014) echo "http://localhost:$1/health/live" ;;
              *) echo "http://localhost:$1/health" ;;
            esac
          }

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            ALL_HEALTHY=true
            for PORT in $SERVICES; do
              URL=$(health_url "$PORT")
              if ! curl -sf "$URL" > /dev/null 2>&1; then
                ALL_HEALTHY=false
                break
              fi
            done

            if [ "$ALL_HEALTHY" = true ]; then
              echo "All services healthy after ${ELAPSED}s"
              exit 0
            fi

            echo "[${ELAPSED}s] Waiting for services..."
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Services not ready after ${MAX_WAIT}s"
          docker compose ps
          docker compose logs --tail=20
          exit 1

      - name: Collect OpenAPI schemas from live services
        run: bash scripts/collect-openapi-schemas.sh

      - name: Check API contract drift
        working-directory: frontend
        run: node scripts/check-contract-drift.mjs

      - name: Check frontend type compatibility with OpenAPI schemas
        working-directory: frontend
        run: yarn test:types --strict

      - name: Seed test data
        continue-on-error: true
        run: |
          pip install psycopg2-binary bcrypt
          python scripts/seed_demo_data.py --clean --host localhost --port 5433

      - name: Run E2E tests
        env:
          INTERNAL_SECRET_TOKEN: ${{ env.E2E_INTERNAL_TOKEN }}
        run: python -m pytest tests/e2e/tests/ -v --tb=short --junitxml=e2e-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e-results.xml

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # E2E UI Tests: run Playwright tests against the full stack
  e2e-ui-tests:
    name: "E2E UI Tests (Playwright)"
    needs: [detect-changes, unit-tests]
    if: needs.detect-changes.outputs.e2e_ui_tests == 'true' || needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
