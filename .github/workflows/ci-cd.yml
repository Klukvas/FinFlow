name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '*/app/**'
      - '**/alembic/**'
      - '**/Dockerfile'
      - '**/startup.sh'
      - '**/requirements.txt'
      - '**/pyproject.toml'
      - '**/package.json'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - 'init/**'
      - 'scripts/**'
      - 'tests/e2e/**'
      - '**/tests/**'
      - 'e2e_ui_tests/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - production
          - staging
        default: staging
      services:
        description: 'Space-separated services to deploy (leave empty for all)'
        required: false
        type: string

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ secrets.REGISTRY || 'docker.io' }}
  IMAGE_PREFIX: ${{ secrets.IMAGE_PREFIX || secrets.DOCKER_USERNAME || github.repository_owner }}

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      account_service: ${{ steps.detect.outputs.account_service }}
      admin_panel: ${{ steps.detect.outputs.admin_panel }}
      category_service: ${{ steps.detect.outputs.category_service }}
      currency_service: ${{ steps.detect.outputs.currency_service }}
      debt_service: ${{ steps.detect.outputs.debt_service }}
      expense_service: ${{ steps.detect.outputs.expense_service }}
      goals_service: ${{ steps.detect.outputs.goals_service }}
      income_service: ${{ steps.detect.outputs.income_service }}
      payment_service: ${{ steps.detect.outputs.payment_service }}
      pdf_parser_service: ${{ steps.detect.outputs.pdf_parser_service }}
      recurring_service: ${{ steps.detect.outputs.recurring_service }}
      scheduler_service: ${{ steps.detect.outputs.scheduler_service }}
      user_service: ${{ steps.detect.outputs.user_service }}
      subscription_service: ${{ steps.detect.outputs.subscription_service }}
      workspace_service: ${{ steps.detect.outputs.workspace_service }}
      ai_assistant_service: ${{ steps.detect.outputs.ai_assistant_service }}
      bank_sync_service: ${{ steps.detect.outputs.bank_sync_service }}
      e2e_ui_tests: ${{ steps.detect.outputs.e2e_ui_tests }}
      services_list: ${{ steps.detect.outputs.services_list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect specific services
        id: detect
        env:
          INPUT_SERVICES: ${{ inputs.services }}
        run: |
          # Initialize all services as false
          FRONTEND="false"
          ACCOUNT_SERVICE="false"
          ADMIN_PANEL="false"
          CATEGORY_SERVICE="false"
          CURRENCY_SERVICE="false"
          DEBT_SERVICE="false"
          EXPENSE_SERVICE="false"
          GOALS_SERVICE="false"
          INCOME_SERVICE="false"
          PAYMENT_SERVICE="false"
          PDF_PARSER_SERVICE="false"
          RECURRING_SERVICE="false"
          SCHEDULER_SERVICE="false"
          USER_SERVICE="false"
          SUBSCRIPTION_SERVICE="false"
          WORKSPACE_SERVICE="false"
          AI_ASSISTANT_SERVICE="false"
          BANK_SYNC_SERVICE="false"
          E2E_UI_TESTS="false"

          # If manual dispatch with specific services
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ -n "${INPUT_SERVICES}" ]]; then
            for svc in ${INPUT_SERVICES}; do
              case $svc in
                frontend) FRONTEND="true" ;;
                account_service) ACCOUNT_SERVICE="true" ;;
                admin_panel) ADMIN_PANEL="true" ;;
                category_service) CATEGORY_SERVICE="true" ;;
                currency_service) CURRENCY_SERVICE="true" ;;
                debt_service) DEBT_SERVICE="true" ;;
                expense_service) EXPENSE_SERVICE="true" ;;
                goals_service) GOALS_SERVICE="true" ;;
                income_service) INCOME_SERVICE="true" ;;
                payment_service) PAYMENT_SERVICE="true" ;;
                pdf_parser_service) PDF_PARSER_SERVICE="true" ;;
                recurring_service) RECURRING_SERVICE="true" ;;
                scheduler_service) SCHEDULER_SERVICE="true" ;;
                user_service) USER_SERVICE="true" ;;
                subscription_service) SUBSCRIPTION_SERVICE="true" ;;
                workspace_service) WORKSPACE_SERVICE="true" ;;
                ai_assistant_service) AI_ASSISTANT_SERVICE="true" ;;
                bank_sync_service) BANK_SYNC_SERVICE="true" ;;
                e2e_ui_tests) E2E_UI_TESTS="true" ;;
              esac
            done
          else
            # Determine diff base: compare against last successful deploy tag,
            # falling back to HEAD^ if no deploy tag exists yet.
            # This ensures ALL changes since last deploy are detected,
            # not just changes in the latest commit.
            if git rev-parse --verify last-deploy >/dev/null 2>&1; then
              DIFF_BASE="last-deploy"
              echo "Comparing against last-deploy tag ($(git rev-parse --short last-deploy))"
            else
              DIFF_BASE="HEAD^"
              echo "No last-deploy tag found, comparing against HEAD^"
            fi

            CHANGED_FILES=$(git diff --name-only "${DIFF_BASE}..HEAD")
            echo "Changed files since ${DIFF_BASE}:"
            echo "$CHANGED_FILES" | head -50

            # Auto-detect changes
            if echo "$CHANGED_FILES" | grep -q "^frontend/"; then
              FRONTEND="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^account_service/"; then
              ACCOUNT_SERVICE="true"
            fi
            # admin_panel disabled for now
            # if echo "$CHANGED_FILES" | grep -q "^admin_panel/"; then
            #   ADMIN_PANEL="true"
            # fi
            if echo "$CHANGED_FILES" | grep -q "^category_service/"; then
              CATEGORY_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^currency_service/"; then
              CURRENCY_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^debt_service/"; then
              DEBT_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^expense_service/"; then
              EXPENSE_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^goals_service/"; then
              GOALS_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^income_service/"; then
              INCOME_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^payment_service/"; then
              PAYMENT_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^pdf_parser_service/"; then
              PDF_PARSER_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^recurring_service/"; then
              RECURRING_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^scheduler_service/"; then
              SCHEDULER_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^user_service/"; then
              USER_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^subscription_service/"; then
              SUBSCRIPTION_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^workspace_service/"; then
              WORKSPACE_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^ai_assistant_service/"; then
              AI_ASSISTANT_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^bank_sync_service/"; then
              BANK_SYNC_SERVICE="true"
            fi
            if echo "$CHANGED_FILES" | grep -q "^e2e_ui_tests/"; then
              E2E_UI_TESTS="true"
            fi

            # If no service directories changed, skip individual service builds/tests.
            # E2E tests still run and cover all services via docker-compose.
            if [[ "$FRONTEND" == "false" ]] && \
               [[ "$ACCOUNT_SERVICE" == "false" ]] && \
               [[ "$ADMIN_PANEL" == "false" ]] && \
               [[ "$CATEGORY_SERVICE" == "false" ]] && \
               [[ "$CURRENCY_SERVICE" == "false" ]] && \
               [[ "$DEBT_SERVICE" == "false" ]] && \
               [[ "$EXPENSE_SERVICE" == "false" ]] && \
               [[ "$GOALS_SERVICE" == "false" ]] && \
               [[ "$INCOME_SERVICE" == "false" ]] && \
               [[ "$PAYMENT_SERVICE" == "false" ]] && \
               [[ "$PDF_PARSER_SERVICE" == "false" ]] && \
               [[ "$RECURRING_SERVICE" == "false" ]] && \
               [[ "$SCHEDULER_SERVICE" == "false" ]] && \
               [[ "$USER_SERVICE" == "false" ]] && \
               [[ "$SUBSCRIPTION_SERVICE" == "false" ]] && \
               [[ "$WORKSPACE_SERVICE" == "false" ]] && \
               [[ "$AI_ASSISTANT_SERVICE" == "false" ]] && \
               [[ "$BANK_SYNC_SERVICE" == "false" ]]; then
              echo "No service changes detected — only E2E tests will run"
            fi
          fi
          
          # Output individual services
          echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT
          echo "account_service=$ACCOUNT_SERVICE" >> $GITHUB_OUTPUT
          echo "admin_panel=$ADMIN_PANEL" >> $GITHUB_OUTPUT
          echo "category_service=$CATEGORY_SERVICE" >> $GITHUB_OUTPUT
          echo "currency_service=$CURRENCY_SERVICE" >> $GITHUB_OUTPUT
          echo "debt_service=$DEBT_SERVICE" >> $GITHUB_OUTPUT
          echo "expense_service=$EXPENSE_SERVICE" >> $GITHUB_OUTPUT
          echo "goals_service=$GOALS_SERVICE" >> $GITHUB_OUTPUT
          echo "income_service=$INCOME_SERVICE" >> $GITHUB_OUTPUT
          echo "payment_service=$PAYMENT_SERVICE" >> $GITHUB_OUTPUT
          echo "pdf_parser_service=$PDF_PARSER_SERVICE" >> $GITHUB_OUTPUT
          echo "recurring_service=$RECURRING_SERVICE" >> $GITHUB_OUTPUT
          echo "scheduler_service=$SCHEDULER_SERVICE" >> $GITHUB_OUTPUT
          echo "user_service=$USER_SERVICE" >> $GITHUB_OUTPUT
          echo "subscription_service=$SUBSCRIPTION_SERVICE" >> $GITHUB_OUTPUT
          echo "workspace_service=$WORKSPACE_SERVICE" >> $GITHUB_OUTPUT
          echo "ai_assistant_service=$AI_ASSISTANT_SERVICE" >> $GITHUB_OUTPUT
          echo "bank_sync_service=$BANK_SYNC_SERVICE" >> $GITHUB_OUTPUT
          echo "e2e_ui_tests=$E2E_UI_TESTS" >> $GITHUB_OUTPUT

          # Build list for deployment
          SERVICES_LIST=""
          [[ "$FRONTEND" == "true" ]] && SERVICES_LIST="$SERVICES_LIST frontend"
          [[ "$ACCOUNT_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST account_service"
          # [[ "$ADMIN_PANEL" == "true" ]] && SERVICES_LIST="$SERVICES_LIST admin_panel"  # disabled for now
          [[ "$CATEGORY_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST category_service"
          [[ "$CURRENCY_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST currency_service"
          [[ "$DEBT_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST debt_service"
          [[ "$EXPENSE_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST expense_service"
          [[ "$GOALS_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST goals_service"
          [[ "$INCOME_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST income_service"
          [[ "$PAYMENT_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST payment_service"
          [[ "$PDF_PARSER_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST pdf_parser_service"
          [[ "$RECURRING_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST recurring_service"
          [[ "$SCHEDULER_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST scheduler_service"
          [[ "$USER_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST user_service"
          [[ "$SUBSCRIPTION_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST subscription_service"
          [[ "$WORKSPACE_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST workspace_service"
          [[ "$AI_ASSISTANT_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST ai_assistant_service"
          # [[ "$BANK_SYNC_SERVICE" == "true" ]] && SERVICES_LIST="$SERVICES_LIST bank_sync_service"  # disabled until feature is ready

          echo "services_list=$SERVICES_LIST" >> $GITHUB_OUTPUT
          echo "Services to build/deploy:$SERVICES_LIST"

  # Unit Tests: run pytest for services that have tests
  unit-tests:
    name: "Unit Tests"
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Run category_service tests
        if: needs.detect-changes.outputs.category_service == 'true'
        working-directory: category_service
        run: |
          poetry install --with dev --no-interaction
          poetry run pip install ../shared
          poetry run pytest -v --tb=short

      - name: Run expense_service tests
        if: needs.detect-changes.outputs.expense_service == 'true'
        working-directory: expense_service
        run: |
          poetry install --with dev --no-interaction
          poetry run pip install ../shared
          poetry run pytest -v --tb=short

      - name: Run user_service tests
        if: needs.detect-changes.outputs.user_service == 'true'
        working-directory: user_service
        run: |
          poetry install --with dev --no-interaction
          poetry run pip install ../shared
          poetry run pytest -v --tb=short

      - name: Run payment_service tests
        if: needs.detect-changes.outputs.payment_service == 'true'
        working-directory: payment_service
        run: |
          pip install -r requirements.txt pytest pytest-asyncio ../shared
          pytest tests/ -v --tb=short

      - name: Run workspace_service tests
        if: needs.detect-changes.outputs.workspace_service == 'true'
        working-directory: workspace_service
        run: |
          poetry install --with dev --no-interaction
          poetry run pip install ../shared
          poetry run pytest -v --tb=short

      - name: Run ai_assistant_service tests
        if: needs.detect-changes.outputs.ai_assistant_service == 'true'
        working-directory: ai_assistant_service
        continue-on-error: true
        run: |
          poetry install --with dev --no-interaction
          poetry run pip install ../shared
          poetry run pytest -v --tb=short

      - name: Run income_service tests
        if: needs.detect-changes.outputs.income_service == 'true'
        working-directory: income_service
        run: |
          pip install -r requirements.txt pytest pytest-asyncio faker ../shared
          pytest app/tests/ -v --tb=short

      - name: Run recurring_service tests
        if: needs.detect-changes.outputs.recurring_service == 'true'
        working-directory: recurring_service
        run: |
          poetry install --with dev --no-interaction
          poetry run pip install ../shared
          poetry run pytest -v --tb=short

      - name: Run account_service tests
        if: needs.detect-changes.outputs.account_service == 'true'
        working-directory: account_service
        run: |
          pip install -r requirements.txt pytest pytest-asyncio ../shared
          pytest app/tests/ -v --tb=short

      - name: Run bank_sync_service tests
        if: needs.detect-changes.outputs.bank_sync_service == 'true'
        working-directory: bank_sync_service
        run: |
          pip install -r requirements.txt pytest pytest-asyncio ../shared
          pytest app/tests/ -v --tb=short

      - name: Run currency_service tests
        if: needs.detect-changes.outputs.currency_service == 'true'
        working-directory: currency_service
        run: |
          pip install -r requirements.txt pytest pytest-asyncio ../shared
          pytest app/tests/ -v --tb=short

      - name: Run debt_service tests
        if: needs.detect-changes.outputs.debt_service == 'true'
        working-directory: debt_service
        run: |
          poetry install --with dev --no-interaction
          poetry run pip install ../shared
          poetry run pytest -v --tb=short

      - name: Run goals_service tests
        if: needs.detect-changes.outputs.goals_service == 'true'
        working-directory: goals_service
        run: |
          pip install -r requirements.txt pytest pytest-asyncio ../shared
          pytest app/tests/ -v --tb=short

      - name: Run pdf_parser_service tests
        if: needs.detect-changes.outputs.pdf_parser_service == 'true'
        working-directory: pdf_parser_service
        run: |
          pip install -r requirements.txt pytest pytest-asyncio ../shared
          pytest app/tests/ -v --tb=short

      - name: Run scheduler_service tests
        if: needs.detect-changes.outputs.scheduler_service == 'true'
        working-directory: scheduler_service
        run: |
          pip install -r requirements.txt pytest pytest-asyncio ../shared
          pytest app/tests/ -v --tb=short

      - name: Run subscription_service tests
        if: needs.detect-changes.outputs.subscription_service == 'true'
        working-directory: subscription_service
        run: |
          pip install -r requirements.txt pytest pytest-asyncio faker ../shared
          pytest tests/ -v --tb=short

  # Stage 1: Frontend Build
  stage1-frontend:
    name: "Stage 1: Build Frontend"
    needs: [detect-changes, e2e-tests]
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_PAYMENTS_ENABLED=${{ secrets.PAYMENTS_ENABLED || 'false' }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN || '' }}
            VITE_ENVIRONMENT=${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/frontend:latest
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/frontend:latest
          cache-to: type=inline

  # Stage 2: Account Service Build
  stage2-account-service:
    name: "Stage 2: Build Account Service"
    needs: [detect-changes, e2e-tests]
    if: needs.detect-changes.outputs.account_service == 'true'
    runs-on: ubuntu-latest
    steps:
