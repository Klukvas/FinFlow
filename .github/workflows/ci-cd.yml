  # Stage 12: Subscription Service Build
  stage12-subscription-service:
    name: "Stage 12: Build Subscription Service"
    needs: [detect-changes, e2e-tests]
    if: needs.detect-changes.outputs.subscription_service == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./subscription_service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/subscription_service:latest
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/subscription_service:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/subscription_service:latest
          cache-to: type=inline

  # Stage 13: Workspace Service Build
  stage13-workspace-service:
