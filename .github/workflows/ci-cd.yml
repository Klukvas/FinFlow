          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/admin_panel:latest
          cache-to: type=inline

  # Stage 15: Payment Service Build
  stage15-payment-service:
    name: "Stage 15: Build Payment Service"
    needs: [detect-changes, e2e-tests]
    if: needs.detect-changes.outputs.payment_service == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./payment_service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/payment_service:latest
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/payment_service:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/payment_service:latest
          cache-to: type=inline

  # Stage 16: Scheduler Service Build
  stage16-scheduler-service:
    name: "Stage 16: Build Scheduler Service"
    needs: [detect-changes, e2e-tests]
    if: needs.detect-changes.outputs.scheduler_service == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scheduler_service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/scheduler_service:latest
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/scheduler_service:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/scheduler_service:latest
          cache-to: type=inline

  # E2E API Tests: build all services, run integration tests
  e2e-tests:
    name: "E2E API Tests"
    needs: [detect-changes, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate .env.docker files
        run: |
          # Shared values
          SECRET="your-secret-key-here"
          ALGO="HS256"
          INTERNAL_TOKEN="my-secret-token"

          # user_service
          cat > user_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/user_db
          SECRET_KEY=$SECRET
          ALGORITHM=$ALGO
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          RATE_LIMIT_PER_MINUTE=400
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          EOF

          # category_service (no env_file in compose, but create for safety)

          # expense_service
          cat > expense_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/expense_db
          SECRET_KEY=$SECRET
          ALGORITHM=$ALGO
          CATEGORY_SERVICE_URL=http://category_service:8000
          ACCOUNT_SERVICE_URL=http://account_service:8000
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          MAX_AMOUNT=999999.99
          MAX_DESCRIPTION_LENGTH=500
          HTTP_TIMEOUT=5.0
          HTTP_RETRY_ATTEMPTS=3
          EOF

          # income_service
          cat > income_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/income_db
          SECRET_KEY=$SECRET
          ALGORITHM=$ALGO
          CATEGORY_SERVICE_URL=http://category_service:8000
          ACCOUNT_SERVICE_URL=http://account_service:8000
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          EOF

          # recurring_service
          cat > recurring_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/recurring_db
          SECRET_KEY=$SECRET
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          EOF

          # goals_service
          cat > goals_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/goals_db
          SECRET_KEY=$SECRET
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          EOF

          # pdf_parser_service
          cat > pdf_parser_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/pdf_parser_db
          INTERNAL_SERVICE_TOKEN=$INTERNAL_TOKEN
          SECRET_KEY=$SECRET
          ALGORITHM=$ALGO
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          EOF

          # debt_service
          cat > debt_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/debt_db
          SECRET_KEY=$SECRET
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          EOF

          # account_service
          cat > account_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/account_db
          REDIS_URL=redis://redis:6379
          SECRET_KEY=$SECRET
          ALGORITHM=$ALGO
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          EXPENSE_SERVICE_URL=http://expense_service:8000
          INCOME_SERVICE_URL=http://income_service:8000
          USER_SERVICE_URL=http://user_service:8000
          CURRENCY_SERVICE_URL=http://currency_service:8000
          HTTP_TIMEOUT=5.0
          HTTP_RETRY_ATTEMPTS=3
          MAX_BALANCE=999999999.99
          MAX_NAME_LENGTH=100
          MAX_DESCRIPTION_LENGTH=500
          MAX_CURRENCY_LENGTH=3
          EOF

          # currency_service
          cat > currency_service/.env.docker << EOF
          REDIS_URL=redis://redis:6379
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          EOF

          # subscription_service
          cat > subscription_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/subscription_db
          SECRET_KEY=$SECRET
          ALGORITHM=$ALGO
          CORS_ORIGINS=*
          LOG_LEVEL=INFO
          RATE_LIMIT_PER_MINUTE=400
          EOF

          # payment_service
          cat > payment_service/.env.docker << EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/payment_db
          REDIS_URL=redis://redis:6379/0
          LOG_LEVEL=INFO
          JWT_SECRET_KEY=$SECRET
          JWT_ALGORITHM=$ALGO
          INTERNAL_SECRET_TOKEN=$INTERNAL_TOKEN
          PADDLE_API_KEY=test_paddle_key
          PADDLE_WEBHOOK_SECRET=test_webhook_secret
          PADDLE_ENVIRONMENT=sandbox
          PADDLE_SUCCESS_URL=http://localhost:3000/payment/return
          PADDLE_CANCEL_URL=http://localhost:3000/pricing
          SERVICE_BASE_URL=http://payment_service:8000
          SUBSCRIPTION_SERVICE_URL=http://subscription_service:8080
          IDEMPOTENCY_TTL_SECONDS=86400
          PAYMENTS_ENABLED=false
          EOF

      - name: Build and start services
        env:
          SECRET_KEY: your-secret-key-here
          JWT_SECRET_KEY: your-secret-key-here
          INTERNAL_SECRET_TOKEN: my-secret-token
        run: docker compose up --build -d

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install httpx pytest pytest-asyncio faker

      - name: Wait for services to be healthy
        run: |
          SERVICES="8001 8002 8003 8004 8009 8011 8012"
          MAX_WAIT=180
          ELAPSED=0
          INTERVAL=5

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            ALL_HEALTHY=true
            for PORT in $SERVICES; do
              if ! curl -sf "http://localhost:$PORT/health" > /dev/null 2>&1; then
                ALL_HEALTHY=false
                break
              fi
            done

            if [ "$ALL_HEALTHY" = true ]; then
              echo "All services healthy after ${ELAPSED}s"
              exit 0
            fi

            echo "[${ELAPSED}s] Waiting for services..."
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Services not ready after ${MAX_WAIT}s"
          docker compose ps
          docker compose logs --tail=20
          exit 1

      - name: Run E2E tests
        run: python -m pytest tests/e2e/tests/ -v --tb=short --junitxml=e2e-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e-results.xml

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # Final Stage: Deploy
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    needs:
      - detect-changes
      - unit-tests
      - e2e-tests
      - stage1-frontend
      - stage2-account-service
      - stage3-category-service
      - stage4-currency-service
      - stage5-debt-service
      - stage6-expense-service
      - stage7-goals-service
      - stage8-income-service
      - stage9-pdf-parser-service
      - stage10-recurring-service
      - stage11-user-service
      - stage12-subscription-service
      - stage13-workspace-service
      - stage14-admin-panel
      - stage15-payment-service
      - stage16-scheduler-service
    # Deploy only after ALL builds complete successfully (or skip if no changes)
    # This ensures we don't deploy while builds are still running
    # Run if: on main/manual dispatch, no failures/cancellations, and at least one service built
    if: |
      always() &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      contains(needs.*.result, 'success')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          host: ${{ secrets.HZ_HOST }}
          user: ${{ secrets.HZ_USER || 'root' }}
          ssh-private-key: ${{ secrets.HZ_SSH_KEY }}
          registry: ${{ env.REGISTRY }}
          image-prefix: ${{ env.IMAGE_PREFIX }}
          db-user: ${{ secrets.DB_USER || 'finflow' }}
          db-password: ${{ secrets.DB_PASSWORD }}
          redis-password: ${{ secrets.REDIS_PASSWORD }}
          cors-origins: ${{ secrets.CORS_ORIGINS || 'https://finflow.ltd' }}
          domain: ${{ secrets.DOMAIN || 'finflow.ltd' }}
          payments-enabled: ${{ secrets.PAYMENTS_ENABLED || 'false' }}
          services: ${{ needs.detect-changes.outputs.services_list }}

      - name: Build Summary
        if: always()
        run: |
          echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Built & Deployed:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage1-frontend.result }}" == "success" ]] && echo "- ✅ Frontend" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage2-account-service.result }}" == "success" ]] && echo "- ✅ Account Service" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage3-category-service.result }}" == "success" ]] && echo "- ✅ Category Service" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage4-currency-service.result }}" == "success" ]] && echo "- ✅ Currency Service" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage5-debt-service.result }}" == "success" ]] && echo "- ✅ Debt Service" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage6-expense-service.result }}" == "success" ]] && echo "- ✅ Expense Service" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage7-goals-service.result }}" == "success" ]] && echo "- ✅ Goals Service" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage8-income-service.result }}" == "success" ]] && echo "- ✅ Income Service" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage9-pdf-parser-service.result }}" == "success" ]] && echo "- ✅ PDF Parser Service" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage10-recurring-service.result }}" == "success" ]] && echo "- ✅ Recurring Service" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage11-user-service.result }}" == "success" ]] && echo "- ✅ User Service" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage12-subscription-service.result }}" == "success" ]] && echo "- ✅ Subscription Service" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage13-workspace-service.result }}" == "success" ]] && echo "- ✅ Workspace Service" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage14-admin-panel.result }}" == "success" ]] && echo "- ✅ Admin Panel" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage15-payment-service.result }}" == "success" ]] && echo "- ✅ Payment Service" >> $GITHUB_STEP_SUMMARY
          [[ "${{ needs.stage16-scheduler-service.result }}" == "success" ]] && echo "- ✅ Scheduler Service" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
