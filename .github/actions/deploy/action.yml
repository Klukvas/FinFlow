name: Deploy via SSH and Compose
description: SSH to single server, sync configs, pull images, and recreate services

inputs:
  host:
    description: Target host (single server)
    required: true
  user:
    description: SSH user
    required: true
    default: root
  ssh-private-key:
    description: SSH private key
    required: true
  registry:
    description: Registry for images
    required: true
  image-prefix:
    description: Image namespace/prefix
    required: true
  db-password:
    description: Database password
    required: true
  db-user:
    description: Database user
    required: true
    default: finflow
  redis-password:
    description: Redis password
    required: true
  cors-origins:
    description: CORS allowed origins (comma-separated)
    required: true
  domain:
    description: Production domain
    required: false
    default: finflow.ltd
  anthropic-api-key:
    description: Anthropic API key for AI assistant
    required: true
  payments-enabled:
    description: Enable payment processing
    required: false
    default: "false"
  bank-token-encryption-key:
    description: Fernet key for encrypting bank tokens (generated on first deploy if empty)
    required: false
    default: ""
  telegram-bot-token:
    description: Telegram bot token for support messages
    required: false
    default: ""
  telegram-support-chat-id:
    description: Telegram chat ID for support messages
    required: false
    default: ""
  docker-username:
    description: Docker registry username
    required: true
  docker-password:
    description: Docker registry password
    required: true
  services:
    description: Space-separated services to deploy (empty = all)
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs['ssh-private-key'] }}

    - name: Add host key
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        ssh-keyscan -H "${{ inputs.host }}" >> ~/.ssh/known_hosts

    - name: Sync config files to server
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        USER: ${{ inputs.user }}
      run: |
        set -euo pipefail
        echo "Syncing config files to server..."

        # Ensure directories exist
        ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" "mkdir -p ~/app/init ~/app/backup"

        # Sync all config files
        scp deploy/docker-compose.yml "$USER@$HOST:~/app/docker-compose.yml"
        scp deploy/Caddyfile "$USER@$HOST:~/app/Caddyfile"
        scp init/init.sql "$USER@$HOST:~/app/init/init.sql"
        scp deploy/backup/backup.sh "$USER@$HOST:~/app/backup/backup.sh"

        echo "Config files synced."

    - name: Deploy
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        USER: ${{ inputs.user }}
        REGISTRY: ${{ inputs.registry }}
        IMAGE_PREFIX: ${{ inputs['image-prefix'] }}
        DB_USER: ${{ inputs['db-user'] }}
        DB_PASSWORD: ${{ inputs['db-password'] }}
        REDIS_PASSWORD: ${{ inputs['redis-password'] }}
        CORS_ORIGINS: ${{ inputs['cors-origins'] }}
        DOMAIN: ${{ inputs.domain }}
        ANTHROPIC_API_KEY: ${{ inputs['anthropic-api-key'] }}
        PAYMENTS_ENABLED: ${{ inputs['payments-enabled'] }}
        TELEGRAM_BOT_TOKEN: ${{ inputs['telegram-bot-token'] }}
        TELEGRAM_SUPPORT_CHAT_ID: ${{ inputs['telegram-support-chat-id'] }}
        DOCKER_USERNAME: ${{ inputs['docker-username'] }}
        DOCKER_PASSWORD: ${{ inputs['docker-password'] }}
        SERVICES: ${{ inputs.services }}
      run: |
        set -euo pipefail
        echo "Starting deployment to $HOST..."

        # Default services if none specified
        if [ -z "${SERVICES:-}" ]; then
          SERVICES="caddy postgres redis frontend account_service ai_assistant_service bank_sync_service category_service currency_service debt_service expense_service goals_service income_service payment_service pdf_parser_service recurring_service scheduler_service subscription_service user_service workspace_service"
        fi

        # URL-encode the DB password
        DB_PASSWORD_ENCODED=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote_plus(os.environ['DB_PASSWORD']))")

        # Generate .env on server
        ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" bash -s <<REMOTE_SCRIPT
        set -euo pipefail
        cd ~/app

        # Preserve existing secrets if present
        if [ -f .env ]; then
          source .env 2>/dev/null || true
        fi

        SECRET_KEY="\${SECRET_KEY:-$(openssl rand -hex 32)}"
        ALGORITHM="\${ALGORITHM:-HS256}"
        INTERNAL_SECRET_TOKEN="\${INTERNAL_SECRET_TOKEN:-$(openssl rand -hex 32)}"
        INPUT_BANK_KEY="${{ inputs['bank-token-encryption-key'] }}"
        BANK_TOKEN_ENCRYPTION_KEY="\${INPUT_BANK_KEY:-\${BANK_TOKEN_ENCRYPTION_KEY:-\$(python3 -c 'import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')}}"

        install -m 600 /dev/null .env
        cat >> .env <<'ENVEOF'
        REGISTRY=${REGISTRY}
        IMAGE_PREFIX=${IMAGE_PREFIX}
        DB_USER=${DB_USER}
        DB_PASSWORD=${DB_PASSWORD}
        DB_PASSWORD_ENCODED=${DB_PASSWORD_ENCODED}
        REDIS_PASSWORD=${REDIS_PASSWORD}
        CORS_ORIGINS=${CORS_ORIGINS}
        DOMAIN=${DOMAIN}
        NODE_ENV=production
        PAYMENTS_ENABLED=${PAYMENTS_ENABLED:-false}
        ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
        ENVEOF

        # Append generated secrets (not overwritten on re-deploy)
        echo "SECRET_KEY=\$SECRET_KEY" >> .env
        echo "ALGORITHM=\$ALGORITHM" >> .env
        echo "INTERNAL_SECRET_TOKEN=\$INTERNAL_SECRET_TOKEN" >> .env
        echo "BANK_TOKEN_ENCRYPTION_KEY=\$BANK_TOKEN_ENCRYPTION_KEY" >> .env
        echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}" >> .env
        echo "TELEGRAM_SUPPORT_CHAT_ID=${TELEGRAM_SUPPORT_CHAT_ID}" >> .env

        # Ensure all service databases exist (init.sql only runs on first Postgres start)
        echo "Ensuring databases exist..."
        for DB_NAME in user_db category_db expense_db income_db recurring_db goals_db debt_db account_db subscription_db payment_db scheduler_db currency_db workspace_db bank_sync_db pdf_parser_db; do
          docker compose exec -T postgres psql -U \${DB_USER} -tc "SELECT 1 FROM pg_database WHERE datname = '\${DB_NAME}'" | grep -q 1 || \
            docker compose exec -T postgres psql -U \${DB_USER} -c "CREATE DATABASE \${DB_NAME};" 2>/dev/null || true
        done
        echo "Databases verified."

        # Pull images
        # Login to Docker registry on server
        echo "${DOCKER_PASSWORD}" | docker login ${REGISTRY} -u "${DOCKER_USERNAME}" --password-stdin

        echo "Pulling images..."
        # Pull app images (skip infra: caddy, postgres, redis which are built/pulled separately)
        APP_SERVICES=\$(echo "${SERVICES}" | tr ' ' '\n' | grep -vE '^(caddy|postgres|redis)$' | tr '\n' ' ')
        echo "App services to pull: \${APP_SERVICES}"
        docker compose pull \${APP_SERVICES}
        echo "Pull complete."

        # Save current state for rollback
        docker compose ps --format json > /tmp/pre-deploy-state.json 2>/dev/null || true

        # Recreate services
        echo "Recreating services: ${SERVICES}"
        if docker compose up -d --force-recreate --remove-orphans ${SERVICES}; then
          echo "Services started successfully"
        else
          echo "Deployment failed - attempting rollback..."
          docker compose up -d --remove-orphans || true
          exit 1
        fi

        # Prune old images
        docker image prune -f || true

        # Health check (wait for services, then report)
        echo "Waiting 30s for services to stabilize..."
        sleep 30
        echo ""
        echo "=== Deployment Status ==="
        docker compose ps
        echo ""

        # Check for unhealthy containers (only deployed services)
        UNHEALTHY=\$(docker compose ps --format json ${SERVICES} | python3 -c "
        import sys, json
        unhealthy = []
        for line in sys.stdin:
          line = line.strip()
          if not line: continue
          try:
            c = json.loads(line)
            if c.get('Health','') == 'unhealthy' or c.get('State','') != 'running':
              unhealthy.append(c.get('Name','unknown'))
          except: pass
        if unhealthy:
          print(','.join(unhealthy))
        " 2>/dev/null || echo "")

        if [ -n "\$UNHEALTHY" ]; then
          echo "WARNING: Unhealthy containers: \$UNHEALTHY"
          exit 1
        fi

        echo "Deployment completed successfully!"
        REMOTE_SCRIPT
