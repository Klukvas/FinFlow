name: Deploy via SSH and Compose
description: SSH to single server, sync configs, pull images, and recreate services

inputs:
  host:
    description: Target host (single server)
    required: true
  user:
    description: SSH user
    required: true
    default: root
  ssh-private-key:
    description: SSH private key
    required: true
  registry:
    description: Registry for images
    required: true
  image-prefix:
    description: Image namespace/prefix
    required: true
  db-password:
    description: Database password
    required: true
  db-user:
    description: Database user
    required: true
    default: finflow
  redis-password:
    description: Redis password
    required: true
  cors-origins:
    description: CORS allowed origins (comma-separated)
    required: true
  domain:
    description: Production domain
    required: false
    default: finflow.ltd
  grafana-admin-password:
    description: Grafana admin password
    required: true
  payments-enabled:
    description: Enable payment processing
    required: false
    default: "false"
  services:
    description: Space-separated services to deploy (empty = all)
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs['ssh-private-key'] }}

    - name: Add host key
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        ssh-keyscan -H "${{ inputs.host }}" >> ~/.ssh/known_hosts

    - name: Sync config files to server
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        USER: ${{ inputs.user }}
      run: |
        set -euo pipefail
        echo "Syncing config files to server..."

        # Ensure directories exist
        ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" "mkdir -p ~/app/init ~/app/backup ~/app/prometheus ~/app/logging ~/app/logging/dashboards"

        # Sync all config files
        scp deploy/docker-compose.yml "$USER@$HOST:~/app/docker-compose.yml"
        scp deploy/Caddyfile "$USER@$HOST:~/app/Caddyfile"
        scp init/init.sql "$USER@$HOST:~/app/init/init.sql"
        scp deploy/backup/backup.sh "$USER@$HOST:~/app/backup/backup.sh"
        scp deploy/prometheus/prometheus.yml "$USER@$HOST:~/app/prometheus/prometheus.yml"
        scp deploy/prometheus/alerts.yml "$USER@$HOST:~/app/prometheus/alerts.yml"
        scp logging/loki-config.yml "$USER@$HOST:~/app/logging/loki-config.yml"
        scp logging/promtail-config.yml "$USER@$HOST:~/app/logging/promtail-config.yml"
        scp logging/grafana-datasources.yml "$USER@$HOST:~/app/logging/grafana-datasources.yml"
        scp logging/grafana-dashboards.yml "$USER@$HOST:~/app/logging/grafana-dashboards.yml"

        # Sync dashboards if they exist
        if [ -d "logging/dashboards" ]; then
          scp -r logging/dashboards/* "$USER@$HOST:~/app/logging/dashboards/" 2>/dev/null || true
        fi

        echo "Config files synced."

    - name: Deploy
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        USER: ${{ inputs.user }}
        REGISTRY: ${{ inputs.registry }}
        IMAGE_PREFIX: ${{ inputs['image-prefix'] }}
        DB_USER: ${{ inputs['db-user'] }}
        DB_PASSWORD: ${{ inputs['db-password'] }}
        REDIS_PASSWORD: ${{ inputs['redis-password'] }}
        CORS_ORIGINS: ${{ inputs['cors-origins'] }}
        DOMAIN: ${{ inputs.domain }}
        GRAFANA_ADMIN_PASSWORD: ${{ inputs['grafana-admin-password'] }}
        PAYMENTS_ENABLED: ${{ inputs['payments-enabled'] }}
        SERVICES: ${{ inputs.services }}
      run: |
        set -euo pipefail
        echo "Starting deployment to $HOST..."

        # Default services if none specified
        if [ -z "${SERVICES:-}" ]; then
          SERVICES="caddy postgres redis frontend account_service category_service currency_service debt_service expense_service goals_service income_service payment_service pdf_parser_service recurring_service scheduler_service subscription_service user_service workspace_service"
        fi

        # URL-encode the DB password
        DB_PASSWORD_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote_plus('$DB_PASSWORD'))")

        # Generate .env on server
        ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" bash -s <<REMOTE_SCRIPT
        set -euo pipefail
        cd ~/app

        # Preserve existing secrets if present
        if [ -f .env ]; then
          source .env 2>/dev/null || true
        fi

        SECRET_KEY="\${SECRET_KEY:-$(openssl rand -hex 32)}"
        ALGORITHM="\${ALGORITHM:-HS256}"
        INTERNAL_SECRET_TOKEN="\${INTERNAL_SECRET_TOKEN:-$(openssl rand -hex 32)}"

        cat > .env <<'ENVEOF'
        REGISTRY=${REGISTRY}
        IMAGE_PREFIX=${IMAGE_PREFIX}
        DB_USER=${DB_USER}
        DB_PASSWORD=${DB_PASSWORD}
        DB_PASSWORD_ENCODED=${DB_PASSWORD_ENCODED}
        REDIS_PASSWORD=${REDIS_PASSWORD}
        CORS_ORIGINS=${CORS_ORIGINS}
        DOMAIN=${DOMAIN}
        NODE_ENV=production
        PAYMENTS_ENABLED=${PAYMENTS_ENABLED:-false}
        GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
        ENVEOF

        # Append generated secrets (not overwritten on re-deploy)
        echo "SECRET_KEY=\$SECRET_KEY" >> .env
        echo "ALGORITHM=\$ALGORITHM" >> .env
        echo "INTERNAL_SECRET_TOKEN=\$INTERNAL_SECRET_TOKEN" >> .env

        # Pull images
        echo "Pulling images..."
        docker compose pull ${SERVICES} || echo "Warning: some images failed to pull"

        # Save current state for rollback
        docker compose ps --format json > /tmp/pre-deploy-state.json 2>/dev/null || true

        # Recreate services
        echo "Recreating services: ${SERVICES}"
        if docker compose up -d --remove-orphans ${SERVICES}; then
          echo "Services started successfully"
        else
          echo "Deployment failed - attempting rollback..."
          docker compose up -d --remove-orphans || true
          exit 1
        fi

        # Prune old images
        docker image prune -f || true

        # Health check (wait for services, then report)
        echo "Waiting 30s for services to stabilize..."
        sleep 30
        echo ""
        echo "=== Deployment Status ==="
        docker compose ps
        echo ""

        # Check for unhealthy containers
        UNHEALTHY=\$(docker compose ps --format json | python3 -c "
        import sys, json
        unhealthy = []
        for line in sys.stdin:
          line = line.strip()
          if not line: continue
          try:
            c = json.loads(line)
            if c.get('Health','') == 'unhealthy' or c.get('State','') != 'running':
              unhealthy.append(c.get('Name','unknown'))
          except: pass
        if unhealthy:
          print(','.join(unhealthy))
        " 2>/dev/null || echo "")

        if [ -n "\$UNHEALTHY" ]; then
          echo "WARNING: Unhealthy containers: \$UNHEALTHY"
          exit 1
        fi

        echo "Deployment completed successfully!"
        REMOTE_SCRIPT
