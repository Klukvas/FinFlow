server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs - collect all logs from all containers
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-containers
          __path__: /var/lib/docker/containers/*/*log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
            time: time
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
      # Parse JSON logs from application services
      - match:
          selector: '{container_name=~".*service.*"}'
          stages:
            - json:
                expressions:
                  timestamp: timestamp
                  level: level
                  service: service
                  message: message
                  user_id: user_id
                  request_id: request_id
                  endpoint: endpoint
                  method: method
                  status_code: status_code
                  duration_ms: duration_ms
                  ip_address: ip_address
                  user_agent: user_agent
                  category: category
                  operation: operation
                  resource_id: resource_id
            - labels:
                level:
                service:
                user_id:
                request_id:
                endpoint:
                method:
                status_code:
                category:
                operation:
            - output:
                source: message
      # For non-JSON logs, just output the raw log
      - match:
          selector: '{container_name!~".*service.*"}'
          stages:
            - output:
                source: output
      - output:
          source: output
