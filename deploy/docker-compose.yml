  # ---------------------------------------------------------------------------
  # Backup
  # ---------------------------------------------------------------------------
  pg_backup:
    image: postgres:16-alpine
    container_name: pg_backup
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASSWORD}
    volumes:
      - /var/backups/postgres:/backups
      - ./backup/backup.sh:/backup.sh:ro
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "chmod +x /backup.sh && echo '0 2 * * * /backup.sh >> /var/log/backup.log 2>&1' | crontab - && crond -f -l 2"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging: *default-logging

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  pdf_uploads:

# ---------------------------------------------------------------------------
# Networks - all internal, no exposed DB/Redis ports
# ---------------------------------------------------------------------------
networks:
  app_network:
    driver: bridge
