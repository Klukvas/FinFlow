    container_name: goals_service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD_ENCODED}@postgres:5432/goals_db
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - INTERNAL_SECRET_TOKEN=${INTERNAL_SECRET_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SUBSCRIPTION_SERVICE_URL=http://subscription_service:8080
      - USER_SERVICE_URL=http://user_service:8000
      - CURRENCY_SERVICE_URL=http://currency_service:8000
      - WORKSPACE_SERVICE_URL=http://workspace_service:8000
      - DOCS_ENABLED=false
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      <<: *fastapi-healthcheck
    deploy: *fastapi-deploy
    logging: *default-logging

  recurring_service:
    image: ${REGISTRY}/${IMAGE_PREFIX}/recurring_service:latest
    container_name: recurring_service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD_ENCODED}@postgres:5432/recurring_db
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - INTERNAL_SECRET_TOKEN=${INTERNAL_SECRET_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - WORKSPACE_SERVICE_URL=http://workspace_service:8000
      - SUBSCRIPTION_SERVICE_URL=http://subscription_service:8080
      - DOCS_ENABLED=false
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      <<: *fastapi-healthcheck
    deploy: *fastapi-deploy
    logging: *default-logging

  subscription_service:
    image: ${REGISTRY}/${IMAGE_PREFIX}/subscription_service:latest
    container_name: subscription_service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD_ENCODED}@postgres:5432/subscription_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - INTERNAL_SECRET_TOKEN=${INTERNAL_SECRET_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - DOCS_ENABLED=false
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      <<: *fastapi-healthcheck
    deploy: *fastapi-deploy
    logging: *default-logging

  payment_service:
    image: ${REGISTRY}/${IMAGE_PREFIX}/payment_service:latest
    container_name: payment_service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD_ENCODED}@postgres:5432/payment_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - INTERNAL_SECRET_TOKEN=${INTERNAL_SECRET_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOG_LEVEL=INFO
      - JWT_SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${ALGORITHM}
      - SERVICE_BASE_URL=http://payment_service:8000
      - SUBSCRIPTION_SERVICE_URL=http://subscription_service:8080
      - IDEMPOTENCY_TTL_SECONDS=86400
      - PAYMENTS_ENABLED=${PAYMENTS_ENABLED:-false}
      - DOCS_ENABLED=false
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live').read()"]
      <<: *fastapi-healthcheck
    deploy: *fastapi-deploy
    logging: *default-logging

  scheduler_service:
    image: ${REGISTRY}/${IMAGE_PREFIX}/scheduler_service:latest
    container_name: scheduler_service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD_ENCODED}@postgres:5432/scheduler_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LOG_LEVEL=INFO
      - INTERNAL_SECRET_TOKEN=${INTERNAL_SECRET_TOKEN}
      - SUBSCRIPTION_SERVICE_URL=http://subscription_service:8080
      - PAYMENT_SERVICE_URL=http://payment_service:8000
      - SCHEDULER_TIMEZONE=UTC
      - RENEWAL_CHECK_CRON=0 */1 * * *
      - RENEWAL_WINDOW_DAYS=1
      - MAX_RETRY_ATTEMPTS=3
      - RETRY_DELAY_SECONDS=300
      - JOB_MAX_INSTANCES=1
      - JOB_COALESCE=true
      - JOB_MISFIRE_GRACE_TIME=300
      - DOCS_ENABLED=false
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health/live').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy: *fastapi-deploy
    logging: *default-logging

  pdf_parser_service:
    image: ${REGISTRY}/${IMAGE_PREFIX}/pdf_parser_service:latest
    container_name: pdf_parser_service
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - internal_service_token=${INTERNAL_SECRET_TOKEN}
      - category_service_url=http://category_service:8000
      - cors_origins=${CORS_ORIGINS}
      - DOCS_ENABLED=false
    volumes:
      - pdf_uploads:/app/uploads
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      <<: *fastapi-healthcheck
    deploy: *fastapi-deploy
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Backup
  # ---------------------------------------------------------------------------
  pg_backup:
    image: postgres:16-alpine
    container_name: pg_backup
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASSWORD}
    volumes:
      - /var/backups/postgres:/backups
      - ./backup/backup.sh:/backup.sh:ro
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "chmod +x /backup.sh && echo '0 2 * * * /backup.sh >> /var/log/backup.log 2>&1' | crontab - && crond -f -l 2"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Monitoring & Logging
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - app_network
      - monitoring_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging: *default-logging

  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node_exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging: *default-logging

  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
      - ./logging/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging: *default-logging

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logging/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/positions
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./logging/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./logging/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./logging/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    logging: *default-logging

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  pdf_uploads:
  prometheus_data:
  loki_data:
  grafana_data:
  promtail_positions:

# ---------------------------------------------------------------------------
# Networks - all internal, no exposed DB/Redis ports
# ---------------------------------------------------------------------------
networks:
  app_network:
    driver: bridge
  monitoring_network:
    driver: bridge
