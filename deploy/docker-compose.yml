# =============================================================================
# FinFlow Production - Single Server Docker Compose
# =============================================================================
# All services on one Hetzner server. No external DB. No exposed internal ports.
# Secrets via .env file. Redis password-protected. PostgreSQL internal only.
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-fastapi-healthcheck: &fastapi-healthcheck
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 30s

x-fastapi-deploy: &fastapi-deploy
  resources:
    limits:
      cpus: '0.50'
      memory: 384M
    reservations:
      cpus: '0.10'
      memory: 128M

services:
  # ---------------------------------------------------------------------------
  # Infrastructure: Database + Cache
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.50'
          memory: 512M
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Reverse Proxy
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /etc/ssl/cf-origin:/etc/ssl/cf-origin:ro
    networks:
      - app_network
      - monitoring_network
    depends_on:
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    image: ${REGISTRY}/${IMAGE_PREFIX}/frontend:latest
    container_name: frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Core Services
  # ---------------------------------------------------------------------------
  user_service:
    image: ${REGISTRY}/${IMAGE_PREFIX}/user_service:latest
    container_name: user_service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD_ENCODED}@postgres:5432/user_db
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - INTERNAL_SECRET_TOKEN=${INTERNAL_SECRET_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SUBSCRIPTION_SERVICE_URL=http://subscription_service:8080
      - WORKSPACE_SERVICE_URL=http://workspace_service:8000
      - DOCS_ENABLED=false
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      <<: *fastapi-healthcheck
    deploy: *fastapi-deploy
    logging: *default-logging

  workspace_service:
    image: ${REGISTRY}/${IMAGE_PREFIX}/workspace_service:latest
    container_name: workspace_service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD_ENCODED}@postgres:5432/workspace_db
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - INTERNAL_SECRET_TOKEN=${INTERNAL_SECRET_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - USER_SERVICE_URL=http://user_service:8000
      - SUBSCRIPTION_SERVICE_URL=http://subscription_service:8080
      - LOG_LEVEL=INFO
      - DOCS_ENABLED=false
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      user_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      <<: *fastapi-healthcheck
    deploy: *fastapi-deploy
    logging: *default-logging

