version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6377:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  user_service:
    build:
      context: .
      dockerfile: ./user_service/dockerfile
    environment:
      ENV_FILE: .env.docker
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3002,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3002,http://127.0.0.1:5173"
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8080"
      WORKSPACE_SERVICE_URL: "http://workspace_service:8000"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
    env_file:
      - ./user_service/.env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=user_service"

  category_service:
    build:
      context: .
      dockerfile: ./category_service/dockerfile
    environment:
      ENV_FILE: .env.docker
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8080"
      WORKSPACE_SERVICE_URL: "http://workspace_service:8000"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/category_db"
      SECRET_KEY: "${SECRET_KEY:-}"
      ALGORITHM: "HS256"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
      LOG_LEVEL: "INFO"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=category_service"

  expense_service:
    build:
      context: .
      dockerfile: ./expense_service/dockerfile
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
      CATEGORY_SERVICE_URL: "http://category_service:8000"
      ACCOUNT_SERVICE_URL: "http://account_service:8000"
      CURRENCY_SERVICE_URL: "http://currency_service:8000"
      WORKSPACE_SERVICE_URL: "http://workspace_service:8000"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/expense_db"
      SECRET_KEY: "${SECRET_KEY:-}"
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8080"
    env_file:
      - ./expense_service/.env.docker
    depends_on:
      db:
        condition: service_healthy
      workspace_service:
        condition: service_healthy
    ports:
      - "8003:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=expense_service"

  income_service:
    build:
      context: .
      dockerfile: ./income_service/Dockerfile
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
      CATEGORY_SERVICE_URL: "http://category_service:8000"
      ACCOUNT_SERVICE_URL: "http://account_service:8000"
      WORKSPACE_SERVICE_URL: "http://workspace_service:8000"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/income_db"
      SECRET_KEY: "${SECRET_KEY:-}"
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8080"
    env_file:
      - ./income_service/.env.docker
    depends_on:
      db:
        condition: service_healthy
      workspace_service:
        condition: service_healthy
      category_service:
        condition: service_started
      user_service:
        condition: service_healthy
      account_service:
        condition: service_started
    ports:
      - "8004:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=income_service"

  recurring_service:
    build:
      context: .
      dockerfile: ./recurring_service/Dockerfile
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/recurring_db"
      SECRET_KEY: "${SECRET_KEY:-}"
      WORKSPACE_SERVICE_URL: "http://workspace_service:8000"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8080"
    env_file:
      - ./recurring_service/.env.docker
    depends_on:
      db:
        condition: service_healthy
      workspace_service:
        condition: service_healthy
      expense_service:
        condition: service_started
      income_service:
        condition: service_started
      category_service:
        condition: service_started
    ports:
      - "8005:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=recurring_service"

  goals_service:
    build:
      context: .
      dockerfile: ./goals_service/Dockerfile
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/goals_db"
      SECRET_KEY: "${SECRET_KEY:-}"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8080"
      USER_SERVICE_URL: "http://user_service:8000"
      CURRENCY_SERVICE_URL: "http://currency_service:8000"
      WORKSPACE_SERVICE_URL: "http://workspace_service:8000"
    env_file:
      - ./goals_service/.env.docker
    depends_on:
      db:
        condition: service_healthy
      user_service:
        condition: service_healthy
      currency_service:
        condition: service_healthy
      workspace_service:
        condition: service_healthy
    ports:
      - "8006:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=goals_service"

  pdf_parser_service:
    build:
      context: .
      dockerfile: ./pdf_parser_service/Dockerfile
    environment:
      ENV_FILE: env.docker
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
      CATEGORY_SERVICE_URL: "http://category_service:8000"
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8080"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/pdf_parser_db"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
      SECRET_KEY: "${SECRET_KEY:-}"
      ALGORITHM: "HS256"
    env_file:
      - ./pdf_parser_service/.env.docker
    depends_on:
      db:
        condition: service_healthy
      category_service:
        condition: service_started
    ports:
      - "8007:8000"
    volumes:
      - pdf_uploads:/app/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=pdf_parser_service"

  debt_service:
    build:
      context: .
      dockerfile: ./debt_service/dockerfile
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/debt_db"
      SECRET_KEY: "${SECRET_KEY:-}"
      WORKSPACE_SERVICE_URL: "http://workspace_service:8000"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
      USER_SERVICE_URL: "http://user_service:8000"
      CURRENCY_SERVICE_URL: "http://currency_service:8000"
      CATEGORY_SERVICE_URL: "http://category_service:8000"
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8080"
    env_file:
      - ./debt_service/.env.docker
    depends_on:
      db:
        condition: service_healthy
      category_service:
        condition: service_started
      user_service:
        condition: service_healthy
      currency_service:
        condition: service_healthy
    ports:
      - "8008:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=debt_service"

  account_service:
    build:
      context: .
      dockerfile: ./account_service/Dockerfile
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/account_db"
      SECRET_KEY: "${SECRET_KEY:-}"
      WORKSPACE_SERVICE_URL: "http://workspace_service:8000"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8080"
    env_file:
      - ./account_service/.env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      workspace_service:
        condition: service_healthy
      user_service:
        condition: service_healthy
      currency_service:
        condition: service_healthy
    ports:
      - "8009:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=account_service"

  currency_service:
    build:
      context: .
      dockerfile: ./currency_service/Dockerfile
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
      REDIS_URL: "redis://redis:6379"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
    env_file:
      - ./currency_service/.env.docker
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8010:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=currency_service"

  subscription_service:
    build:
      context: .
      dockerfile: ./subscription_service/Dockerfile
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3002,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3002,http://127.0.0.1:5173"
      # App settings (SUBS_ prefix)
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/subscription_db"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "${SECRET_KEY:-}"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
      # JWT secret for admin token verification (must match user_service)
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
    env_file:
      - ./subscription_service/.env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/bin/sh", "-c", "./startup.sh"]
    working_dir: /app
    ports:
      - "8011:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=subscription_service"

  # IMPORTANT: Payment Service requires Paddle Billing configuration
  # Before using, you MUST:
  # 1. Get Paddle API key and webhook secret from https://vendors.paddle.com
  # 2. Configure payment_service/.env.docker with your Paddle credentials
  # 3. Verify Paddle webhook URL is configured in Paddle notification settings
  # See: payment_service/README.md for complete setup instructions
  payment_service:
    build:
      context: .
      dockerfile: ./payment_service/Dockerfile
    env_file:
      - ./payment_service/.env.docker
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/payment_db"
      REDIS_URL: "redis://redis:6379/0"
      LOG_LEVEL: "INFO"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
      JWT_ALGORITHM: "HS256"
      SERVICE_BASE_URL: "http://payment_service:8000"
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8080"
      IDEMPOTENCY_TTL_SECONDS: "86400"
      # PAYMENTS_ENABLED is set in payment_service/.env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      subscription_service:
        condition: service_started
    ports:
      - "8013:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=payment_service"

  scheduler_service:
    build:
      context: .
      dockerfile: ./scheduler_service/Dockerfile
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/scheduler_db"
      REDIS_URL: "redis://redis:6379/0"
      LOG_LEVEL: "INFO"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
      # Service URLs
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8080"
      PAYMENT_SERVICE_URL: "http://payment_service:8000"
      # Scheduler Configuration
      SCHEDULER_TIMEZONE: "UTC"
      RENEWAL_CHECK_CRON: "0 */1 * * *"  # Every hour
      RENEWAL_WINDOW_DAYS: "1"
      MAX_RETRY_ATTEMPTS: "3"
      RETRY_DELAY_SECONDS: "300"
      JOB_MAX_INSTANCES: "1"
      JOB_COALESCE: "true"
      JOB_MISFIRE_GRACE_TIME: "300"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      subscription_service:
        condition: service_started
      payment_service:
        condition: service_healthy
    ports:
      - "8014:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health/live').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=scheduler_service"

  ai_assistant_service:
    build:
      context: .
      dockerfile: ./ai_assistant_service/Dockerfile
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
      REDIS_URL: "redis://redis:6379"
      SECRET_KEY: "${SECRET_KEY:-}"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "claude-haiku-4-5-20251001"
      EXPENSE_SERVICE_URL: "http://expense_service:8000"
      INCOME_SERVICE_URL: "http://income_service:8000"
      DEBT_SERVICE_URL: "http://debt_service:8000"
      GOALS_SERVICE_URL: "http://goals_service:8000"
      ACCOUNT_SERVICE_URL: "http://account_service:8000"
      CATEGORY_SERVICE_URL: "http://category_service:8000"
      RECURRING_SERVICE_URL: "http://recurring_service:8000"
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8080"
    env_file:
      - ./ai_assistant_service/.env.docker
    depends_on:
      redis:
        condition: service_healthy
      subscription_service:
        condition: service_started
    ports:
      - "8015:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=ai_assistant_service"

  bank_sync_service:
    build:
      context: .
      dockerfile: ./bank_sync_service/dockerfile
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/bank_sync_db"
      SECRET_KEY: "${SECRET_KEY:-}"
      ALGORITHM: "HS256"
      WORKSPACE_SERVICE_URL: "http://workspace_service:8000"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
      EXPENSE_SERVICE_URL: "http://expense_service:8000"
      INCOME_SERVICE_URL: "http://income_service:8000"
      ACCOUNT_SERVICE_URL: "http://account_service:8000"
      CATEGORY_SERVICE_URL: "http://category_service:8000"
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8080"
    env_file:
      - ./bank_sync_service/.env.docker
    depends_on:
      db:
        condition: service_healthy
      workspace_service:
        condition: service_healthy
      expense_service:
        condition: service_started
      income_service:
        condition: service_started
      account_service:
        condition: service_started
      category_service:
        condition: service_started
    ports:
      - "8016:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=bank_sync_service"

  workspace_service:
    build:
      context: .
      dockerfile: ./workspace_service/Dockerfile
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/workspace_db"
      SECRET_KEY: "${SECRET_KEY:-}"
      ALGORITHM: "HS256"
      INTERNAL_SECRET_TOKEN: "${INTERNAL_SECRET_TOKEN:-}"
      USER_SERVICE_URL: "http://user_service:8000"
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8080"
      LOG_LEVEL: "INFO"
    depends_on:
      db:
        condition: service_healthy
      user_service:
        condition: service_healthy
      subscription_service:
        condition: service_started
    ports:
      - "8012:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=workspace_service"

volumes:
  postgres_data:
  redis_data:
  pdf_uploads:
